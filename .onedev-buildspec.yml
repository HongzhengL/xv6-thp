version: 38
jobs:
- name: Run Test
  steps:
  - !CheckoutStep
    name: Checkout
    cloneCredential: !DefaultCredential {}
    withLfs: false
    withSubmodules: false
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !CommandStep
    name: Build & Test
    runInContainer: true
    image: git.hongzhengli.com/cs537-intro-os/cs537
    interpreter: !ShellInterpreter
      shell: bash
      commands: |
        make -C solution
        cd tests
        ./run-tests.sh
    useTTY: true
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  triggers:
  - !BranchUpdateTrigger {}
  retryCondition: never
  maxRetries: 1
  retryDelay: 30
  timeout: 180
- name: Push to GitHub
  steps:
  - !PushRepository
    name: GitHub_Push
    remoteUrl: https://github.com/HongzhengL/xv6-thp.git
    userName: HongzhengL
    passwordSecret: GitHubAccessToken
    force: false
    condition: ALWAYS
  triggers:
  - !BranchUpdateTrigger {}
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
